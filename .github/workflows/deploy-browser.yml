# Deploy the hosted sitebuilder browser editor to Cloudflare Pages.
#
# This workflow is intentionally decoupled from `release.yml`. Use it when:
#   - Changes land on `main` and should update the hosted sitebuilder
#     without waiting for the next desktop release tag.
#   - You need a first-time / emergency CF Pages deploy from the Actions UI.
#   - The desktop build matrix is broken on a platform you don't care
#     about right now and would otherwise block the browser deploy.
#
# Required repository secrets (same as in release.yml):
#   - CLOUDFLARE_API_TOKEN  (token with Account → Pages → Edit permission)
#   - CLOUDFLARE_ACCOUNT_ID (visible in the Cloudflare dashboard sidebar)
#
# The first step idempotently creates the Pages project if missing — so
# you can run this end-to-end without any prior dashboard setup. If the
# project already exists, `wrangler pages project create` exits with a
# "project already exists" error which we tolerate via `|| true`.

name: Deploy sitebuilder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-browser.yml"
      - "packages/**"
      - "e2e/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-sitebuilder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy sitebuilder to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Node 22: Wrangler 4 requires it; matches the deploy-browser job
      # in release.yml.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build archival HTML (hosted sitebuilder)
        run: pnpm --filter @sosb/browser-shell build:archival

      # `build:archival` outputs `builder.html` (descriptive name for the
      # downloadable archival use case). CF Pages serves `index.html` at
      # `/` by default, so we stage a copy here. Both URLs work:
      # `/` and `/builder.html`.
      - name: Stage as index.html for CF Pages root serving
        run: cp packages/browser-shell/dist/archival/builder.html packages/browser-shell/dist/archival/index.html

      - name: Ensure Pages project exists (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create student-org-site-builder \
            --production-branch=main \
            || echo "Project already exists — proceeding."

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy packages/browser-shell/dist/archival
            --project-name=student-org-site-builder
            --branch=${{ github.ref_name }}
