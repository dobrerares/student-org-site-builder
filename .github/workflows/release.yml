# Release workflow — on a `v*` tag push, builds + publishes per-platform
# installers and deploys the hosted browser editor to Cloudflare Pages.
#
# Triggers
# --------
# - Push of any tag matching `v*` (e.g. `v1.0.0`, `v1.2.3-beta.1`).
# - Manual run via the Actions UI (`workflow_dispatch`) for dry-run checks
#   on a tagged commit; this path can be told to skip the publish step.
#
# Why per-platform runners
# ------------------------
# electron-builder needs the native toolchain for each target installer:
#
#   - Linux runner builds the AppImage (and could also build .deb / .rpm).
#   - macOS runner builds the .dmg (must run on macOS).
#   - Windows runner builds the NSIS .exe.
#
# Cross-compiling unsigned builds is technically possible from one runner
# (electron-builder supports it for AppImage), but Mac DMG and Windows
# NSIS are reliable only on their native runners. A 3-platform matrix is
# the documented electron-builder pattern.
#
# Auto-update wiring
# ------------------
# `electron-builder --publish always` uploads the built installer + the
# `latest-*.yml` manifest to the GitHub Release that the tag created.
# `electron-updater` (running inside the packaged app) polls those
# manifests at runtime to discover new releases (#36 acceptance criteria).
#
# `secrets.GITHUB_TOKEN` is the GitHub-provisioned token automatically
# available to actions; electron-builder picks it up via the `GH_TOKEN`
# env var. No personal access token required.
#
# Mac signing
# -----------
# Mac code signing is OUT OF SCOPE for v1 (#44, wontfix). The
# `mac.identity: null` line in `electron-builder.config.cjs` makes the
# unsigned build explicit. Users open the app via right-click → Open on
# first launch.
#
# Browser editor deploy
# ---------------------
# The hosted browser editor (`@sosb/browser-shell`) publishes via two
# paths on the same `v*` tag, so desktop and browser users always run the
# same release:
#
#   1. The single-file archival HTML is attached as an asset on the
#      GitHub Release (offline-friendly: officers can save the `.html`
#      and open it from anywhere, even from a USB stick).
#   2. The same HTML deploys to Cloudflare Pages so non-technical users
#      can hit a stable URL without downloading anything.
#
# The deploy job has `needs: build`, so a failure on any platform
# installer aborts both browser-publication paths and leaves the previous
# release live. The attach step runs before the CF deploy: if CF fails,
# the archival HTML is still preserved on the GitHub Release as a
# fallback distribution channel.
#
# We use `cloudflare/wrangler-action@v3` (not the deprecated
# `cloudflare/pages-action`) so the same `wrangler pages deploy` command
# works locally and in CI. `--branch=main` routes the upload to the
# project's production deployment; CF Pages treats any other branch label
# as a preview. The CF project's configured production branch must match.
#
# Required repository secrets:
#   - CLOUDFLARE_API_TOKEN  (token with Account → Pages → Edit permission)
#   - CLOUDFLARE_ACCOUNT_ID (visible in the Cloudflare dashboard sidebar)
#
# One-time setup: create a Pages project in the Cloudflare dashboard whose
# slug matches `--project-name` below (currently `student-org-site-builder`).
# Rename the slug here if your CF project uses a different one.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Build without publishing to a Release (dry run)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      # `pnpm --filter @sosb/electron-shell exec` scopes execution to the
      # package that owns the `electron-builder` devDep — pnpm workspaces
      # are isolated by default, so the binary isn't on PATH from root.
      # cwd becomes `packages/electron-shell/`, so the `--config` path is
      # relative to that package.
      - name: Package + publish (electron-builder)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dryRun != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @sosb/electron-shell exec electron-builder --config electron-builder.config.cjs --publish always

      - name: Package only (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dryRun == 'true' }}
        run: pnpm --filter @sosb/electron-shell exec electron-builder --config electron-builder.config.cjs --publish never

  deploy-browser:
    name: Publish browser editor (Releases + Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dryRun != 'true' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Node 22 (not 20 like the build matrix): Wrangler 4 — used by
      # `cloudflare/wrangler-action@v3` to talk to Cloudflare Pages —
      # requires Node ≥ 22. The desktop build matrix stays on Node 20
      # because that's the project's documented engine requirement and
      # what's validated across Linux/macOS/Windows.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build archival HTML (hosted browser editor)
        run: pnpm --filter @sosb/browser-shell build:archival

      - name: Attach archival HTML to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/browser-shell/dist/archival/builder.html

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy packages/browser-shell/dist/archival
            --project-name=student-org-site-builder
            --branch=main
