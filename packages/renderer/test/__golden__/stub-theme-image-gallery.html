  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 2rem;
  --space-xl: 4rem;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --font-headline: Georgia, serif;
  --font-body: system-ui, sans-serif;
  --color-primary: #1f3a5f;
  --color-accent: #c08a3e;
  --color-fg: #1a1a1a;
  --color-bg: #ffffff;
  --color-muted: #5c5c5c;
  --color-primary: #1f3a5f;
  --color-accent: #c08a3e;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--color-bg);
  color: var(--color-fg);
  font-family: var(--font-body);
  line-height: 1.5;
}
main { display: block; }
[data-block="hero"] {
  padding: var(--space-xl) var(--space-md);
}
[data-block="hero"] .hero__eyebrow {

  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-muted);
  margin: 0 0 var(--space-sm) 0;
}
[data-block="hero"] h1 {
  font-family: var(--font-headline);
  margin: 0 0 var(--space-md) 0;
  color: var(--color-primary);
}
[data-block="hero"] .hero__subtitle {
  margin: 0 0 var(--space-md) 0;
  color: var(--color-fg);
}
[data-block="hero"] .hero__media {
  margin-top: var(--space-md);
  border-radius: var(--radius-md);
  overflow: hidden;
}
[data-block="hero"] .hero__media img {
  display: block;
  max-width: 100%;
  height: auto;
}
[data-block="imageGallery"] {

}

  margin: 0 0 var(--space-md) 0;
  color: var(--color-primary);
}
[data-block="imageGallery"] .image-gallery__grid {

  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--space-md);
  grid-template-columns: repeat(var(--gallery-columns), minmax(0, 1fr));

  column-count: var(--gallery-columns);
  column-gap: var(--space-md);
}
[data-block="imageGallery"][data-layout="masonry"] .image-gallery__item {
  break-inside: avoid;
  margin-bottom: var(--space-md);
}
[data-block="imageGallery"] .image-gallery__figure {
  margin: 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
}
[data-block="imageGallery"] .image-gallery__trigger {
  display: block;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  width: 100%;
}
[data-block="imageGallery"] .image-gallery__trigger img,
[data-block="imageGallery"] .image-gallery__figure > img {
  display: block;
  width: 100%;
  height: auto;
}
[data-block="imageGallery"] .image-gallery__caption {
  font-size: 0.875rem;
  color: var(--color-muted);
  margin-top: var(--space-sm);
}
[data-sosb-lightbox] {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--color-fg);
  z-index: 1000;
}
[data-sosb-lightbox][hidden] { display: none; }
[data-sosb-lightbox] .sosb-lightbox__backdrop {
  position: absolute;
  inset: 0;
  background: var(--color-fg);
  opacity: 0.92;
}
[data-sosb-lightbox] .sosb-lightbox__panel {

  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-md);
  max-width: 90vw;
  max-height: 90vh;
}
[data-sosb-lightbox] .sosb-lightbox__figure {
  margin: 0;
  display: grid;
  gap: var(--space-sm);
  text-align: center;
}
[data-sosb-lightbox] .sosb-lightbox__figure img {
  display: block;
  max-width: 100%;
  max-height: 80vh;
  height: auto;
  margin: 0 auto;
  border-radius: var(--radius-md);
}
[data-sosb-lightbox] .sosb-lightbox__caption {
  color: var(--color-bg);
  font-size: 0.875rem;
}
[data-sosb-lightbox] .sosb-lightbox__btn {
  background: transparent;
  color: var(--color-bg);
  border: 1px solid var(--color-bg);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 1.5rem;
  line-height: 1;
  padding: var(--space-sm) var(--space-md);
  cursor: pointer;
}
[data-sosb-lightbox] .sosb-lightbox__btn--close {
  position: absolute;
  top: var(--space-sm);
  right: var(--space-sm);
